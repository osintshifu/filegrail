<svg xmlns="http://www.w3.org/2000/svg" width="760" height="716" viewBox="0 0 760 716" role="img" aria-label="How FileGrail works. A file is read for provenance (browser history, OS traces, shell history, archives, torrents), metadata (EXIF, XMP, C2PA, PDF, Office) and content (PDF text, Office, email, structured data). What is found becomes evidence, which gives pivots, conflicts and a timeline, then relationships and an evidence graph, delivered as a report, a CASE/UCO export or to AI agents over MCP." font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace">
