name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    # A tag publishes only a commit whose full CI run succeeded: every platform
    # and Python version, the fuzzing, the CASE and the differential jobs.
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read

    steps:
      - name: Wait for the CI run of this commit and require its success
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --event push --limit 1 --json databaseId --jq '.[0].databaseId')
          test -n "$id"
          gh run watch "$id" --repo "$GITHUB_REPOSITORY" --exit-status

  verify:
    needs: ci
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify the release commit
        run: |
          git fetch --depth=1 origin master:refs/remotes/origin/master
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/master)"
          VERSION=$(python -c 'exec(open("src/filegrail/__init__.py").read()); print(__version__)')
          test "v$VERSION" = "$GITHUB_REF_NAME"
      - name: Install verification tools
        run: python -m pip install -e ".[dev]"
      - name: Verify
        run: |
          ruff check .
          ruff format --check .
          pytest
          mypy

  build:
    # Built once: the files checked here are the files PyPI and the release
    # page receive, byte for byte.
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build and check
        run: |
          python -m pip install build twine
          python -m build
          twine check dist/*
          python tools/check_wheel.py
      - name: Install the wheel and run it
        run: |
          python -m venv "$RUNNER_TEMP/installed"
          "$RUNNER_TEMP/installed/bin/pip" install dist/*.whl
          test "$("$RUNNER_TEMP/installed/bin/filegrail" --version)" = "filegrail ${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi

    # Trusted Publishing: PyPI verifies this workflow's identity, so there is
    # no API token to store, rotate or leak.
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest

    # The release page carries the changelog's section for this version and
    # the files PyPI received.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/release_notes.py "$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "filegrail ${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag --latest
