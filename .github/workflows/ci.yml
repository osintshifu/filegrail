name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        # The photo extra is here because the matrix is what says whether a
        # commit works, and a feature only some of it exercises is a feature
        # nothing says that about.
        run: python -m pip install -e ".[dev,photo]"
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Tests
        run: pytest

  fuzz:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev,fuzz]"
      # Its own job, and not in the matrix: what this looks at is the decoders'
      # arithmetic, which does not vary by platform, and how long it looks is
      # what makes it useful. A red run here is a file somebody could write.
      - name: Properties
        run: pytest tests/test_properties.py
        env:
          HYPOTHESIS_PROFILE: ci

  case:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev,case]"
      # Its own job because the validator weighs more than everything else here
      # put together. Reading the JSON back cannot tell whether a document is
      # CASE: a bare date string, a missing identifier or a reference going
      # nowhere all parse and none of them are valid, and the person who finds
      # out is the one who was sent the file.
      - name: CASE validation
        run: pytest tests/test_case_validation.py

  differential:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          sudo apt-get update
          # `libarchive-zip-perl` is a Recommends of exiftool, and without it
          # exiftool cannot open a zip at all - it reads an Office package as
          # an opaque file and reports nothing out of it. Named here because
          # --no-install-recommends is worth keeping for a reproducible job.
          sudo apt-get install -y --no-install-recommends \
            libimage-exiftool-perl libarchive-zip-perl
          python -m pip install -e ".[dev]"
      # A fixture built from a specification and read by the parser it was
      # built for agrees with itself, and that is all it proves. The readers
      # here search for payloads rather than walk container structure, which is
      # right for evidence work and means a malformed fixture passes in silence.
      # This has already found a PDF whose information dictionary the cross
      # reference table did not list and an Ogg page with no checksum: read
      # perfectly here, unreadable by anything else.
      - name: Differential comparison
        run: pytest tests/test_differential.py
      # Format identification is held against DROID, The National Archives'
      # own reader of the registry, run on the signature files the package was
      # compiled from. The test checks those files by digest.
      - name: DROID and the PRONOM signature files
        run: |
          mkdir -p "$RUNNER_TEMP/droid" "$RUNNER_TEMP/pronom"
          curl -fsSL -o "$RUNNER_TEMP/droid.zip" \
            https://github.com/digital-preservation/droid/releases/download/6.9.14/droid-binary-6.9.14-bin.zip
          echo "82eae61a216a1b33cd27f8ee673d871be805c7e60dec3b18c7d9bed47a913b0a  $RUNNER_TEMP/droid.zip" | sha256sum -c
          unzip -q "$RUNNER_TEMP/droid.zip" -d "$RUNNER_TEMP/droid"
          for name in DROID_SignatureFile_V125.xml container-signature-20260119.xml; do
            curl -fsSL -o "$RUNNER_TEMP/pronom/$name" "https://cdn.nationalarchives.gov.uk/documents/$name"
          done
      - name: Identification against DROID
        env:
          DROID: ${{ runner.temp }}/droid/droid.sh
          PRONOM_SOURCES: ${{ runner.temp }}/pronom
        run: pytest tests/test_pronom_differential.py

  types:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Mypy
        run: mypy

  package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          twine check dist/*
      - name: What has to be inside the wheel, and what it has to say
        run: |
          python - <<'CHECK'
          import glob, zipfile

          wheel = zipfile.ZipFile(glob.glob("dist/*.whl")[0])
          names = wheel.namelist()

          # Neither of these is imported, so nothing else notices their absence:
          # the TLD list is data the identifier reader needs, and the marker is
          # what makes the annotations visible to anyone installing this.
          for needed in ("filegrail/data/tlds.txt", "filegrail/py.typed"):
              assert needed in names, (needed, names)

          metadata = wheel.read(
              next(n for n in names if n.endswith(".dist-info/METADATA"))
          ).decode()
          assert "License-Expression: Apache-2.0" in metadata, metadata
          assert "License-File: LICENSE" in metadata, metadata
          assert "Classifier: License ::" not in metadata, metadata
          CHECK
      - name: Install what was built and run it
        run: |
          python -m pip install dist/*.whl
          filegrail --version
